name: CI

on:
  pull_request:
  push:
    branches: [main]

# The quality stages the kit's stage #8 aggregates. Names here are the ones
# ds-kit.config.yml lists under npm_scripts — the gate runs them BY NAME, so a
# rename in package.json without a rename there produces a stage that silently
# never runs.
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # build:tokens comes first and is not optional. generated/ is not committed,
      # so typecheck, test and the Storybook build all read artifacts that do not
      # exist until this runs. A green run without it means the later stages
      # measured an empty directory.
      # Before anything else: the pipeline exists twice in this repository (the
      # portable kit, and the .claude/ copy the agent session actually reads). Two
      # copies that disagree means two processes, which is worse than one that is
      # out of date.
      - name: pipeline copies are in sync
        run: bash tools/check-claude-dir-in-sync.sh

      # The orchestrator delegates by NAME. An agent named in ds-kit.config.yml and
      # absent from .claude/agents/ is a stage that fails downstream of its cause.
      - name: every agent the config names exists
        run: bash tools/check-agents-exist.sh

      # prototypes/ is documented as ungated. That is a claim about configuration,
      # and configuration drifts — the first symptom would be a prototype PR
      # demanding a frozen spec.
      - name: the prototype zone is still outside the gates
        run: bash tools/check-prototypes-are-ungated.sh

      - run: npm run build:tokens
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
