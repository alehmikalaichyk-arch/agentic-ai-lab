name: CI

on:
  pull_request:
  push:
    branches: [main]

# The quality stages the kit's stage #8 aggregates. Names here are the ones
# ds-kit.config.yml lists under npm_scripts — the gate runs them BY NAME, so a
# rename in package.json without a rename there produces a stage that silently
# never runs.
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # build:tokens comes first and is not optional. generated/ is not committed,
      # so typecheck, test and the Storybook build all read artifacts that do not
      # exist until this runs. A green run without it means the later stages
      # measured an empty directory.
      # Before anything else: the pipeline exists twice in this repository (the
      # portable kit, and the .claude/ copy the agent session actually reads). Two
      # copies that disagree means two processes, which is worse than one that is
      # out of date.
      - name: pipeline copies are in sync
        run: bash tools/check-claude-dir-in-sync.sh

      # The orchestrator delegates by NAME. An agent named in ds-kit.config.yml and
      # absent from .claude/agents/ is a stage that fails downstream of its cause.
      - name: every agent the config names exists
        run: bash tools/check-agents-exist.sh

      # prototypes/ is documented as ungated. That is a claim about configuration,
      # and configuration drifts — the first symptom would be a prototype PR
      # demanding a frozen spec.
      - name: the prototype zone is still outside the gates
        run: bash tools/check-prototypes-are-ungated.sh

      # A key that reads as empty makes every tool use its built-in default and say
      # nothing. Cheaper to catch here than to discover from a plan that describes
      # the opposite of what is configured.
      - name: every configured key actually parses
        run: bash tools/check-config-readable.sh

      # This repository is public and on a personal account. Token descriptions were
      # copied verbatim from the system these tokens were adapted from, and carried
      # internal decisions, ticket ids and a person's name — inside prose that reads
      # like ordinary documentation, which is why nothing noticed.
      - name: no identifiers from the source organisation
        run: bash tools/check-no-source-identifiers.sh

      - run: npm run build:tokens
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Stage #4.5 asks the owner to LOOK at a draft before the spec is frozen, and
      # that only happens if looking is cheap. The published Storybook deploys from
      # main, so it cannot show a draft that lives on a spec branch — it would appear
      # only after the merge it was supposed to inform.
      #
      # Building it here does two things: it catches a draft that does not compile
      # (a green story build proves compilation, not rendering, but a red one is
      # decisive), and it produces an artifact a reviewer can download and open.
      # That is worse than a link and much better than "run it locally so I can look",
      # which is the sentence that kills the checkpoint.
      - run: npm run build-storybook
      - name: publish the Storybook as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.event.pull_request.number || github.sha }}
          path: storybook-static
          retention-days: 14
